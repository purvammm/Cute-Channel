# Tool settings only: this repo is a set of scripts, not an installable package.
# Run everything through `python cc.py ...` (see README.md).

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".tools", ".cache", ".venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, common bug patterns, modern syntax
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# SVG drawing code: one long f-string per SVG element reads better than wrapped fragments.
"pipeline/sheets.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
